<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — MTA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070B0A">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<style>
:root{--bg:#070B0A;--fg:#F1F5F3;--muted:rgb(241 245 243 / .68);--accent:#3DDC97;--accent-ink:#05110B;--line:rgb(255 255 255 / .16)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Arabic','Noto Sans Hebrew',sans-serif;
  background:radial-gradient(ellipse 90% 45% at 50% 108%,rgb(61 220 151 / .22),transparent 70%),var(--bg);color:var(--fg);min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center;line-height:1.5}
main{max-width:34rem}
img{height:34px;width:auto;margin:0 auto 32px;display:block}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.15;text-wrap:balance}
p{margin-top:14px;color:var(--muted);font-size:16.5px}
p[lang]{font-size:15px;margin-top:6px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a.btn{display:inline-flex;align-items:center;padding:12px 22px;border-radius:999px;font-weight:600;text-decoration:none}
a.primary{background:var(--accent);color:var(--accent-ink)}
a.primary:hover{background:#5BE6A9}
a.ghost{color:var(--fg);border:1px solid var(--line)}
a.ghost:hover{border-color:var(--accent);color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <a href="/"><img src="/assets/mta-logo-white.png" alt="MTA home" width="419" height="111"></a>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old or mistyped. Your spare part is still one request away.</p>
  <p lang="he" dir="rtl">הדף לא נמצא. החלק שלך עדיין במרחק בקשה אחת.</p>
  <p lang="ar" dir="rtl">الصفحة غير موجودة. قطعتك ما زالت على بُعد طلب واحد.</p>
  <div class="actions">
    <a class="btn primary" href="/">Back to MTA home</a>
    <a class="btn ghost" href="/#download">Download the app</a>
  </div>
</main>
</body>
</html>
